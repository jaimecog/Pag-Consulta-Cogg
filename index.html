<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrandIdentity Form Pro | All-in-One</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDeep: '#073B4C',
                        brandOrange: '#FF6B35',
                        brandGreen: '#06D6A0',
                        brandYellow: '#FFD166',
                    },
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        sans: ['Open Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #073B4C;
            color: #ffffff;
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, .font-montserrat {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #073B4C; }
        ::-webkit-scrollbar-thumb { background: #FF6B35; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e55a2b; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .color-picker-input::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-input::-webkit-color-swatch { border: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^18.2.0",
        "react-dom/": "https://esm.sh/react-dom@^18.2.0/",
        "react/": "https://esm.sh/react@^18.2.0/",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,typescript" data-type="module">
        import { GoogleGenAI, Type } from "@google/genai";
        const { useState, useRef, useEffect } = React;
        
        // --- Constants ---
        const BRAND_COLORS_PRESET = ['#073B4C', '#FF6B35', '#06D6A0', '#FFD166', '#118AB2', '#EF476F'];
        const ToneOptions = ['Profesional', 'Creativo', 'Cercano/Amistoso', 'Autoritario', 'Minimalista'];
        const EstiloOptions = ['Minimalista', 'Cinematográfico', 'Moderno', 'Tecnológico', 'Ilustración infantil'];


        // --- Components ---

        const ColorSelector = ({ selectedColors, onColorsChange }) => {
            const [customHex, setCustomHex] = useState('');
            const [pickerColor, setPickerColor] = useState('#06D6A0');
            const colorPickerRef = useRef(null);

            const addColor = (color) => {
                const hex = color.startsWith('#') ? color.toUpperCase() : `#${color.toUpperCase()}`;
                if (/^#[0-9A-F]{6}$/i.test(hex)) {
                    if (!selectedColors.includes(hex)) {
                        onColorsChange([...selectedColors, hex]);
                    }
                    setCustomHex('');
                }
            };

            const removeColor = (color) => {
                onColorsChange(selectedColors.filter(c => c !== color));
            };

            const handlePickerChange = (e) => {
                const newColor = e.target.value.toUpperCase();
                setPickerColor(newColor);
                setCustomHex(newColor);
            };

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center">
                        <label className="text-sm font-semibold uppercase tracking-wider font-montserrat">Paleta de Colores</label>
                        <div className="flex gap-2">
                            {selectedColors.length > 0 && (
                                <button
                                    type="button"
                                    onClick={() => onColorsChange([])}
                                    className="text-[10px] font-bold px-3 py-1 rounded-full bg-white/5 text-[#EF476F] border border-[#EF476F]/20 hover:bg-[#EF476F]/10 transition-all uppercase"
                                >
                                    Limpiar Todo
                                </button>
                            )}
                        </div>
                    </div>
                    
                    <div className="flex flex-wrap items-center gap-4">
                        {/* Preset Circles */}
                        <div className="flex gap-2">
                            {BRAND_COLORS_PRESET.slice(0, 4).map(color => (
                                <button
                                    key={color}
                                    type="button"
                                    onClick={() => addColor(color)}
                                    className={`w-9 h-9 rounded-full border-2 transition-all hover:scale-110 active:scale-90 ${selectedColors.includes(color) ? 'border-white' : 'border-transparent shadow-md'}`}
                                    style={{ backgroundColor: color }}
                                />
                            ))}
                        </div>

                        {/* Interactive Input Group */}
                        <div className="flex items-center bg-[#0d2a35] border border-white/5 rounded-xl px-3 py-2 gap-3 h-12 shadow-inner">
                            <span className="text-[10px] font-bold text-white/40 tracking-widest font-mono">HEX</span>
                            
                            <input
                                type="text"
                                value={customHex}
                                onChange={(e) => setCustomHex(e.target.value.toUpperCase())}
                                placeholder="#000000"
                                className="bg-transparent text-white text-xs font-mono outline-none w-20 placeholder:text-white/10"
                            />

                            {/* Color Square Trigger */}
                            <div 
                                className="w-6 h-4 rounded border border-white/20 cursor-pointer relative overflow-hidden"
                                style={{ backgroundColor: pickerColor }}
                                onClick={() => colorPickerRef.current?.click()}
                            >
                                <input
                                    type="color"
                                    ref={colorPickerRef}
                                    value={pickerColor}
                                    onChange={handlePickerChange}
                                    className="absolute inset-0 opacity-0 cursor-pointer scale-150 color-picker-input"
                                />
                            </div>

                            {/* Confirm Add Button */}
                            <button
                                type="button"
                                onClick={() => addColor(customHex || pickerColor)}
                                className="w-8 h-6 bg-[#FF6B35] text-white rounded flex items-center justify-center hover:brightness-110 active:scale-95 transition-all shadow-md"
                            >
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M12 4v16m8-8H4" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    {/* Tags List */}
                    <div className="flex flex-wrap gap-2 pt-2 min-h-[40px]">
                        {selectedColors.map(color => (
                            <div
                                key={color}
                                className="flex items-center gap-2 px-3 py-1.5 bg-white/5 rounded-lg border border-white/10 text-[10px] font-mono animate-fade-in group"
                            >
                                <div className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: color }} />
                                <span className="text-white/70">{color}</span>
                                <button
                                    type="button"
                                    onClick={() => removeColor(color)}
                                    className="text-white/30 hover:text-[#FF6B35] font-bold transition-colors ml-1"
                                >
                                    ×
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const FileUpload = ({ preview, onFileSelect }) => {
            const fileInputRef = useRef(null);
            const handleFileChange = (e) => {
                const file = e.target.files?.[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => onFileSelect(reader.result, file.name);
                    reader.readAsDataURL(file);
                }
            };
            return (
                <div className="space-y-4">
                    <label className="block text-sm font-semibold mb-2 uppercase tracking-wider font-montserrat">Logotipo de Marca</label>
                    <div 
                        onClick={() => fileInputRef.current?.click()}
                        className="cursor-pointer border-2 border-dashed border-white/10 rounded-2xl p-8 text-center hover:border-brandOrange transition-all bg-white/5 hover:bg-white/10"
                    >
                        <input type="file" ref={fileInputRef} onChange={handleFileChange} accept=".jpg,.jpeg,.png,.svg,.webp" className="hidden" />
                        {preview ? (
                            <div className="flex flex-col items-center gap-4">
                                <img src={preview} alt="Preview" className="max-h-32 object-contain rounded-lg shadow-xl" />
                                <p className="text-xs text-brandGreen font-bold uppercase tracking-wider">Logo cargado correctamente</p>
                            </div>
                        ) : (
                            <div>
                                <div className="w-14 h-14 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/10">
                                    <svg className="w-7 h-7 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                    </svg>
                                </div>
                                <p className="text-sm text-white/60">Haz clic para subir un archivo (.jpg, .png, .svg, .webp)</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [formData, setFormData] = useState({
                nombre: '',
                colores: [],
                descripcion: '',
                tono: ToneOptions[0],
                estilo: EstiloOptions[0],
                redesSociales: { youtube: false, instagram: false, tiktok: false },
                logo: null,
                logoName: null
            });
            const [submittedData, setSubmittedData] = useState(null);
            const [errors, setErrors] = useState([]);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(p => ({ ...p, [name]: value }));
            };

            const handleCheckboxChange = (name) => {
                setFormData(p => ({
                    ...p,
                    redesSociales: { ...p.redesSociales, [name]: !p.redesSociales[name] }
                }));
            };

            const validate = () => {
                const errs = [];
                if (!formData.nombre.trim()) errs.push("El nombre es requerido.");
                if (formData.colores.length === 0) errs.push("Selecciona al menos un color.");
                if (!formData.descripcion.trim()) errs.push("La descripción es requerida.");
                setErrors(errs);
                return errs.length === 0;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (validate()) {
                    setSubmittedData({ ...formData, timestamp: new Date().toISOString() });
                    setTimeout(() => document.getElementById('result')?.scrollIntoView({ behavior: 'smooth' }), 100);
                }
            };

            return (
                <div className="max-w-4xl mx-auto py-12 px-6">
                    <header className="text-center mb-16">
                        <h1 className="text-5xl mb-4 tracking-tight font-montserrat">Brand<span className="text-brandOrange">Identity</span> Pro</h1>
                        <p className="text-brandGreen font-bold uppercase tracking-widest text-xs mb-4">Configurador de Identidad Visual</p>
                        <div className="w-20 h-1 bg-brandOrange mx-auto rounded-full" />
                    </header>

                    <main className="bg-white/5 backdrop-blur-xl border border-white/10 rounded-[2.5rem] shadow-2xl overflow-hidden p-8 md:p-12">
                        <form onSubmit={handleSubmit} className="space-y-10">
                            
                            <div>
                                <label className="block text-sm font-semibold mb-3 uppercase tracking-wider font-montserrat">Nombre Comercial</label>
                                <input
                                    type="text"
                                    name="nombre"
                                    value={formData.nombre}
                                    onChange={handleInputChange}
                                    className="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-brandOrange outline-none transition-all placeholder:text-white/10"
                                    placeholder="Nombre de tu marca..."
                                />
                            </div>

                            <ColorSelector 
                                selectedColors={formData.colores} 
                                onColorsChange={(colors) => setFormData(p => ({ ...p, colores: colors }))}
                            />

                            <div className="grid md:grid-cols-2 gap-10">
                                <div>
                                    <label className="block text-sm font-semibold mb-3 uppercase tracking-wider font-montserrat">Estilo de Comunicación (Tono)</label>
                                    <select
                                        name="tono"
                                        value={formData.tono}
                                        onChange={handleInputChange}
                                        className="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-brandOrange outline-none appearance-none cursor-pointer"
                                    >
                                        {ToneOptions.map(o => <option key={o} value={o} className="bg-brandDeep text-white">{o}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-3 uppercase tracking-wider font-montserrat">Estilo (Afecta imagen, video y música)</label>
                                    <select
                                        name="estilo"
                                        value={formData.estilo}
                                        onChange={handleInputChange}
                                        className="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-brandOrange outline-none appearance-none cursor-pointer"
                                    >
                                        {EstiloOptions.map(o => <option key={o} value={o} className="bg-brandDeep text-white">{o}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-semibold mb-3 uppercase tracking-wider font-montserrat">Presencia Digital</label>
                                <div className="flex gap-4 flex-wrap">
                                    {Object.keys(formData.redesSociales).map(key => (
                                        <button
                                            key={key}
                                            type="button"
                                            onClick={() => handleCheckboxChange(key)}
                                            className={`px-4 py-2 rounded-xl border text-[10px] font-bold transition-all uppercase tracking-widest ${
                                                formData.redesSociales[key] 
                                                ? 'bg-brandGreen border-brandGreen text-brandDeep shadow-lg shadow-brandGreen/20' 
                                                : 'bg-white/5 border-white/10 text-white/40 hover:border-white/30'
                                            }`}
                                        >
                                            {key}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="relative">
                                <div className="mb-3">
                                    <label className="block text-sm font-semibold uppercase tracking-wider font-montserrat">Descripción y Misión</label>
                                </div>
                                <textarea
                                    name="descripcion"
                                    value={formData.descripcion}
                                    onChange={handleInputChange}
                                    rows="4"
                                    className="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:ring-2 focus:ring-brandOrange outline-none transition-all resize-none"
                                    placeholder="Describe qué hace única a tu marca..."
                                />
                            </div>

                            <FileUpload 
                                preview={formData.logo} 
                                onFileSelect={(b, n) => setFormData(p => ({ ...p, logo: b, logoName: n }))} 
                            />

                            {errors.length > 0 && (
                                <div className="p-4 bg-red-500/10 border border-red-500/20 rounded-2xl animate-fade-in">
                                    {errors.map((e, i) => <p key={i} className="text-xs text-red-400 font-bold">• {e}</p>)}
                                </div>
                            )}

                            <button
                                type="submit"
                                className="w-full bg-brandOrange text-white py-5 rounded-2xl font-black text-lg shadow-2xl shadow-brandOrange/20 hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-3 group uppercase tracking-widest"
                            >
                                Guardar Identidad
                                <svg className="w-6 h-6 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                                </svg>
                            </button>
                        </form>
                    </main>

                    {submittedData && (
                        <div id="result" className="mt-20 animate-fade-in">
                            <div className="flex items-center gap-4 mb-6">
                                <div className="h-0.5 flex-1 bg-white/10"></div>
                                <h2 className="text-3xl font-semibold font-montserrat">Identidad Generada</h2>
                                <div className="h-0.5 flex-1 bg-white/10"></div>
                            </div>
                            
                            <div className="bg-[#052c38] border border-white/10 rounded-3xl overflow-hidden shadow-2xl">
                                <div className="bg-white/5 px-6 py-4 flex justify-between items-center border-b border-white/5">
                                    <span className="text-[10px] font-mono text-white/30 uppercase tracking-[0.2em]">brand_configuration.json</span>
                                    <div className="flex gap-2">
                                        <div className="w-2.5 h-2.5 rounded-full bg-red-400/30"></div>
                                        <div className="w-2.5 h-2.5 rounded-full bg-yellow-400/30"></div>
                                        <div className="w-2.5 h-2.5 rounded-full bg-green-400/30"></div>
                                    </div>
                                </div>
                                <pre className="p-8 text-brandGreen font-mono text-xs md:text-sm overflow-x-auto leading-relaxed">
                                    {JSON.stringify(submittedData, null, 2)}
                                </pre>
                            </div>
                            
                            <button 
                                onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                                className="mt-10 mx-auto block text-white/20 hover:text-brandOrange text-[10px] font-bold uppercase tracking-widest transition-colors"
                            >
                                ↑ Volver arriba
                            </button>
                        </div>
                    )}

                    <footer className="mt-24 text-center opacity-20 text-[10px] font-bold uppercase tracking-[0.4em]">
                        Developed with Gemini 3 Pro & React 18
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
